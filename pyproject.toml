[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "tabrion-studio"
dynamic = ["version"]
description = "Local developer tool for SQLite and PostgreSQL databases built on Tabrion"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "TRADEMARKS.md"]
authors = [{ name = "Peter Karlhuber" }]
keywords = ["database", "sqlite", "postgresql", "developer-tools", "tabrion"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database :: Front-Ends",
    "Typing :: Typed",
]
dependencies = [
    # tabrion is not on PyPI: the range is here, the v0.1.0 commit is pinned by its full SHA in
    # constraints/tabrion-integration.txt (RC-8, ADR 0009 amendment, docs/TODO.md TS-001).
    # migrations: Alembic read only, for tabrion.migrations.status (STU-015), run in a worker process.
    "tabrion[migrations,postgres,sqlalchemy]>=0.1,<0.2",
    "psycopg[binary]>=3.2,<4",
    "fastapi>=0.115,<1",
    # Without [standard]: no uvloop/httptools/websockets requirement (05 section 3.2).
    "uvicorn>=0.30,<1",
    "pydantic>=2.9,<3",
    "keyring>=25,<26",
    "platformdirs>=4.2,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "pytest-cov>=5",
    # The FastAPI test client; Starlette 1.x prefers httpx2 over httpx (05 section 3.2 names httpx).
    "httpx2>=2.16",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "mkdocs-material>=9.5",
    "build>=1.2",
    # hatch_build.py (the wheel build hook) is unit-tested.
    "hatchling>=1.26",
    "twine>=6",
    # tests/security/test_workflows.py loads every workflow (PR #76 review M-1); already pulled in by mkdocs.
    "pyyaml>=6",
]

[project.scripts]
tabrion-studio = "tabrion_studio.cli:main"

[project.urls]
Repository = "https://github.com/peterkarlhuber/tabrion-studio"
Issues = "https://github.com/peterkarlhuber/tabrion-studio/issues"
Security = "https://github.com/peterkarlhuber/tabrion-studio/blob/master/SECURITY.md"

[tool.hatch.version]
path = "src/tabrion_studio/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tabrion_studio"]
# The built frontend is not in git (.gitignore); `artifacts` puts it into the wheel anyway.
artifacts = ["src/tabrion_studio/static/**"]

[tool.hatch.build.targets.wheel.hooks.custom]
# hatch_build.py: a wheel (not an editable install) must contain static/index.html (STU-018).
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
    "src/tabrion_studio",
    "frontend",
    "scripts",
    "tests",
    "docs",
    "hatch_build.py",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "TRADEMARKS.md",
    "mkdocs.yml",
    "pyproject.toml",
    "dependency-policy.json",  # TABRION QA-17: tests/architecture/test_dependency_policy.py
    "build-constraints.txt",
]
exclude = ["frontend/node_modules", "frontend/dist"]
artifacts = ["src/tabrion_studio/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "process: starts real tabrion-studio processes (STU-002)",
    "security: workflow pins, supply chain and other security regressions",
    "packaging: needs a built wheel (TABRION_STUDIO_DIST)",
    "postgres: needs a PostgreSQL server (TABRION_STUDIO_TEST_POSTGRES, a libpq URL of a database it may change)",
    "postgres_superuser: needs TABRION_STUDIO_TEST_POSTGRES and TABRION_STUDIO_TEST_POSTGRES_SUPERUSER (a superuser of the same server; makes and drops its own roles)",
]
filterwarnings = ["error"]
# A test that runs this long hangs: dump every thread's stack, so a CI job that times out says where (TD-024), and
# end the run, so the step fails before the job's time limit and its log is kept (I-1 of the Windows delta review).
faulthandler_timeout = 300
faulthandler_exit_on_timeout = true

[tool.coverage.run]
source = ["tabrion_studio"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py311"
# scripts/check_dependency_policy.py is an unchanged, checksummed copy from nodestro-studio (TABRION QA-17), linted there.
extend-exclude = ["frontend", "scripts/check_dependency_policy.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["tabrion_studio"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, start subprocesses with fixed arguments and use throwaway tokens.
"tests/**" = ["S101", "S103", "S104", "S105", "S106", "S603", "S607", "S310"]
# Build and CI helper scripts run fixed tool commands.
"scripts/**" = ["S603", "S607", "S310"]
"hatch_build.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["tabrion_studio"]
mypy_path = "src"
warn_unused_ignores = true

# Import contracts (AC-1 = QA-16, 05 section 4.2, edge list K-33): tabrion-studio may use tabrion (public names only,
# scripts/check_tabrion_api.py, AC-7) and no Levuvo platform. The security package (STU-003) sits below the app, the
# server and the CLI; the full layer contract api -> services -> profiles/security (05 section 3.2) follows with
# those packages (STU-006, docs/TODO.md TD-001).
[tool.importlinter]
root_packages = ["tabrion_studio"]
include_external_packages = true
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
id = "no-levuvo-platform"
name = "Tabrion Studio depends on no Levuvo platform (K-33)"
type = "forbidden"
source_modules = ["tabrion_studio"]
forbidden_modules = [
    "orkexa",
    "axentra",
    "axentra_studio",
    "nodestro",
    "nodestro_runtime",
    "nodestro_api",
    "nodestro_studio",
    "nodestro_examples",
    "nodestro_integrations",
    "nodestro_sdk",
    "nodestro_client",
    "levuvo_nextcloud_mcp",
]

[[tool.importlinter.contracts]]
id = "process-model-below-cli"
name = "The process model and the app never import the CLI"
type = "forbidden"
source_modules = ["tabrion_studio.app", "tabrion_studio.instance", "tabrion_studio.server", "tabrion_studio.idle"]
forbidden_modules = ["tabrion_studio.cli"]

[[tool.importlinter.contracts]]
id = "problems-and-logs-below-everything"
name = "Problem documents and logging (STU-004) import no other Studio layer"
type = "forbidden"
source_modules = ["tabrion_studio.problems", "tabrion_studio.logs"]
forbidden_modules = [
    "tabrion_studio.app",
    "tabrion_studio.server",
    "tabrion_studio.instance",
    "tabrion_studio.cli",
    "tabrion_studio.security",
    "tabrion_studio.request_log",
]

[[tool.importlinter.contracts]]
id = "config-below-api"
name = "Configuration and trust (STU-006) never import the services, the API, the app, the server, the CLI or security"
type = "forbidden"
source_modules = ["tabrion_studio.config"]
forbidden_modules = [
    "tabrion_studio.services",
    "tabrion_studio.api",
    "tabrion_studio.app",
    "tabrion_studio.server",
    "tabrion_studio.instance",
    "tabrion_studio.cli",
    "tabrion_studio.security",
    "tabrion_studio.request_log",
]

[[tool.importlinter.contracts]]
id = "services-below-api"
name = "The services (STU-009 connection registry) never import the API, the app, the server, the CLI or security"
type = "forbidden"
source_modules = ["tabrion_studio.services"]
forbidden_modules = [
    "tabrion_studio.api",
    "tabrion_studio.app",
    "tabrion_studio.server",
    "tabrion_studio.instance",
    "tabrion_studio.cli",
    "tabrion_studio.security",
    "tabrion_studio.request_log",
]

[[tool.importlinter.contracts]]
id = "engines-only-in-services"
name = "Only the services open database engines: SQLAlchemy and psycopg stay out of the API, the app and the config"
type = "forbidden"
source_modules = ["tabrion_studio.api", "tabrion_studio.app", "tabrion_studio.server", "tabrion_studio.config"]
forbidden_modules = ["sqlalchemy", "psycopg"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "security-below-app"
name = "The security package never imports the app, the server, the process model or the CLI"
type = "forbidden"
source_modules = ["tabrion_studio.security"]
forbidden_modules = ["tabrion_studio.app", "tabrion_studio.server", "tabrion_studio.instance", "tabrion_studio.cli"]
