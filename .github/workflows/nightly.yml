name: Nightly

# STU-018 (05 section 3.5): the whole PR suite (ci.yml, on Linux, macOS and Windows) once a night on master, plus the
# test-ID inventory, so that breakage from outside the repository (new dependency releases, advisories, runner
# images) shows up as an open issue rather than on the next unrelated PR. Added by later work
# packages: e2e on WebKit (K12, QA-9) and the tabrion-HEAD compatibility run once tabrion has releases.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      canary_fail:
        description: Make the canary job fail (proves that a red nightly opens an issue)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ci:
    # ci.yml uses no secrets and publishes nothing, so nothing is inherited.
    uses: ./.github/workflows/ci.yml

  canary:
    # Proves that a red nightly opens an issue.
    if: inputs.canary_fail
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: exit 1

  inventory:
    # The test IDs of the suite, counted and hashed, so that a change which silently drops tests is visible.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]" -c constraints/tabrion-integration.txt
      - name: Collect the test IDs (test-ids.txt)
        run: python -m pytest --collect-only -q -p no:cacheprovider > "$GITHUB_WORKSPACE/test-ids.txt" || true
      - name: Count the test IDs and write the job summary
        run: |
          set -euo pipefail
          grep -E '::' test-ids.txt | sort > test-ids.sorted || true
          n=$(wc -l < test-ids.sorted)
          sum=$(sha256sum test-ids.sorted | cut -d' ' -f1)
          { echo "### Test-ID inventory"; echo; echo "| Tests | SHA-256 of the sorted list |"; echo "|---|---|"; echo "| $n | \`$sum\` |"; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$n" -lt 1 ]; then echo "::error::no test IDs collected"; tail -n 30 test-ids.txt; exit 1; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-ids
          path: test-ids.sorted

  report:
    # Opens one "Nightly failed" issue on red, comments on it while it stays red, closes it on the next green run.
    needs: [ci, canary, inventory]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Open, update or close the nightly issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Nightly failed"
          failed=$(python3 -c 'import json,os; n=json.loads(os.environ["NEEDS"]); print(" ".join(k for k,v in n.items() if v["result"] not in ("success","skipped")))')
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq "map(select(.title==\"$title\"))[0].number // empty")
          if [ -n "$failed" ]; then
            body="Nightly run $RUN_URL failed: $failed (commit $GITHUB_SHA)."
            if [ -n "$number" ]; then gh issue comment "$number" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
            exit 1
          elif [ -n "$number" ]; then
            gh issue comment "$number" --body "Nightly run $RUN_URL is green again (commit $GITHUB_SHA). Closing."
            gh issue close "$number"
          fi
