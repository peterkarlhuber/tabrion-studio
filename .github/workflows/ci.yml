name: CI

# STU-018 (05 section 3.5, 07 section 4.1): every job name below is a mandatory check in .github/ci-manifest.json;
# ci-ok.yml aggregates them and posts the commit status "ci-ok" on the pull request head. Actions are pinned by full
# commit SHA (tests/security/test_workflows.py). Jobs whose content arrives with later work packages are added by
# them: "openapi in sync" (STU-008, TD-011). The "e2e" job (Chromium
# and axe, review U-3 of stu-005-051-review.md) is extended by QA-9 with the platforms smoke; Firefox and WebKit run
# the same suites in the job "e2e (<browser>)" (STU-050, TD-047), required like "e2e" since both are green (PR #63).
# Nothing here releases or publishes anything (G-R).
# tabrion is not published on PyPI (ADR 0009 amendment, tabrion PR #20): every install of Studio takes the tabrion
# commit from constraints/tabrion-integration.txt (a full-SHA Git pin, tests/security/test_dependencies.py).
# TD-031 (security review F-6): every other runtime dependency comes from the hashed lock constraints/runtime-lock.txt
# (pip --require-hashes --no-deps, wheels only), the same file docs/guide/installation.md installs from; after the
# development tools, `pip check` and `scripts/runtime_lock.py check-installed` prove that the runtime closure is
# exactly the lock. `python -m build` takes its backend from the hashed build-constraints.txt.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # The nightly (nightly.yml) runs this workflow once a night on master.
  workflow_call:

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels the older run of that pull request; every other run gets its own group.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  backend-lint:
    name: backend lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      # DC-TS-1: pip 24.0 to 26.0 crash on a "-c" Git pin with extras; 26.1 and newer never ask an index for tabrion.
      - run: python -m pip install "pip>=26.1"
      - run: pip install --require-hashes --no-deps --only-binary ":all:" -r constraints/runtime-lock.txt
      - run: pip install -e ".[dev]" -c constraints/tabrion-integration.txt
      - run: pip check
      - run: python scripts/runtime_lock.py check-installed
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --strict src tests scripts hatch_build.py
      # AC-1 (QA-16): import contracts in pyproject.toml (edge list K-33).
      - run: lint-imports
      # AC-7: only public Tabrion names.
      - run: python scripts/check_tabrion_api.py
      # TD-031: the hashed runtime lock is inside the pyproject.toml ranges and agrees with build-constraints.txt.
      - run: python scripts/runtime_lock.py check
      # CI-FAST: the manifest, the workflow files and ci-ok.yml agree; the ci-ok scripts are tested.
      - run: python3 -I .github/scripts/ci_ok.py --self-check --root .
      - run: python3 -m unittest discover -s .github/scripts -p "test_ci_ok*.py"

  backend-test:
    name: backend test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: Python 3.11, os: ubuntu-latest, python: "3.11" }
          - { label: Python 3.12, os: ubuntu-latest, python: "3.12" }
          - { label: Python 3.13, os: ubuntu-latest, python: "3.13" }
          - { label: Python 3.14, os: ubuntu-latest, python: "3.14" }
          - { label: macos-latest, os: macos-latest, python: "3.13" }
          - { label: windows-latest, os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # STU-001: the editable install on every OS (without the built frontend).
      # DC-TS-1: pip 24.0 to 26.0 crash on a "-c" Git pin with extras; 26.1 and newer never ask an index for tabrion.
      - run: python -m pip install "pip>=26.1"
      - run: pip install --require-hashes --no-deps --only-binary ":all:" -r constraints/runtime-lock.txt
      - run: pip install -e ".[dev]" -c constraints/tabrion-integration.txt
      - run: pip check
      - run: python scripts/runtime_lock.py check-installed
      - run: pip list
      # Unit, process-model (STU-002: start < 2 s, reuse, idle exit, shutdown), security and supply-chain tests.
      - run: pytest -m "not packaging" --cov=tabrion_studio --cov-report=term-missing

  security:
    name: security tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      # DC-TS-1: pip 24.0 to 26.0 crash on a "-c" Git pin with extras; 26.1 and newer never ask an index for tabrion.
      - run: python -m pip install "pip>=26.1"
      - run: pip install --require-hashes --no-deps --only-binary ":all:" -r constraints/runtime-lock.txt
      - run: pip install -e ".[dev]" -c constraints/tabrion-integration.txt
      - run: pip check
      - run: python scripts/runtime_lock.py check-installed
      # Workflow pins, read-only tokens, no publishing, license policy, the STU-T access tests of STU-003.
      - run: pytest -m security -v -p no:cacheprovider
      # ruff's flake8-bandit rules (S) over the package and the scripts.
      - run: ruff check --select S src scripts hatch_build.py

  windows-t2:
    name: T-2 path checks (windows-latest)
    # TD-008 (review C-2 of stu-006-review.md): the T-2 tests by name on Windows, where a UNC value from the project
    # file could open an SMB connection (nt._getfinalpathname). The gate below fails when one of them is missing,
    # skipped or failed, so a skip condition or a rename cannot turn the check off unnoticed.
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      # DC-TS-1: pip 24.0 to 26.0 crash on a "-c" Git pin with extras; 26.1 and newer never ask an index for tabrion.
      - run: python -m pip install "pip>=26.1"
      - run: pip install --require-hashes --no-deps --only-binary ":all:" -r constraints/runtime-lock.txt
      - run: pip install -e ".[dev]" -c constraints/tabrion-integration.txt
      - run: pip check
      - run: python scripts/runtime_lock.py check-installed
      - run: >-
          pytest -v -p no:cacheprovider -rs --junitxml="$RUNNER_TEMP/t2.xml"
          tests/unit/test_config_locations.py
          tests/security/test_project_trust.py::test_network_paths_are_refused_before_any_file_system_access
          tests/security/test_project_trust.py::test_windows_never_resolves_a_unc_path_from_the_project_file
      - name: Every T-2 test ran on Windows and none was skipped
        env:
          JUNIT: ${{ runner.temp }}/t2.xml
        run: |
          python -I - <<'PY'
          import collections, os, xml.etree.ElementTree as ET
          # The T-2 tests that must pass here; the link tests of test_config_locations.py are POSIX only (symlinks).
          required = {
              "test_network_device_and_drive_relative_forms_are_refused",
              "test_ordinary_paths_are_not_refused",
              "test_windows_containment_as_text",
              "test_posix_containment_as_text",
              "test_roots_of_another_flavour_never_match",
              "test_contained_touches_no_file_for_a_refused_or_outside_value",
              "test_network_paths_are_refused_before_any_file_system_access",
              "test_windows_never_resolves_a_unc_path_from_the_project_file",
          }
          counts = collections.Counter()
          for case in ET.parse(os.environ["JUNIT"]).getroot().iter("testcase"):
              name = case.get("name", "").split("[", 1)[0]
              outcome = next((child.tag for child in case if child.tag in ("failure", "error", "skipped")), "passed")
              if outcome == "skipped" and name not in required:
                  message = next(child.get("message", "") for child in case if child.tag == "skipped")
                  outcome = "skipped (posix only)" if "symlinks" in message else "skipped"
              counts[(name, outcome)] += 1
          print(dict(counts))
          bad = {key: n for key, n in counts.items() if key[1] in ("failure", "error", "skipped")}
          assert not bad, bad
          missing = sorted(name for name in required if counts[(name, "passed")] == 0)
          assert not missing, f"no passing run of {missing}"
          rows = [f"| {name} | {counts[(name, 'passed')]} |" for name in sorted(required)]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("### T-2 on Windows\n\n| Test | Passed |\n|---|---|\n" + "\n".join(rows) + "\n")
          PY

  backend-integration:
    name: backend integration (PostgreSQL 17)
    # STU-009 (03 section 8, TD-012): the PostgreSQL tests (marker "postgres") against a real server, as a role that
    # owns its database but is no superuser, so only Studio's read-only settings stop the writes. Password
    # authentication (SCRAM), so the M-1 tests (no libpq password fallback) mean something. The tests that make roles
    # (marker "postgres_superuser", STU-014 CI-1) use the service's own superuser, set on the pytest step only.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.10@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
        env:
          # A throwaway server of this job only; the values are not secrets.
          POSTGRES_PASSWORD: ci-admin-pw
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports:
          # Published on the loopback address only (re-review 2, Info).
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      TABRION_STUDIO_TEST_POSTGRES: postgresql://studio_owner:ci-owner-pw@127.0.0.1:5432/studio_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      # DC-TS-1: pip 24.0 to 26.0 crash on a "-c" Git pin with extras; 26.1 and newer never ask an index for tabrion.
      - run: python -m pip install "pip>=26.1"
      - run: pip install --require-hashes --no-deps --only-binary ":all:" -r constraints/runtime-lock.txt
      - run: pip install -e ".[dev]" -c constraints/tabrion-integration.txt
      - run: pip check
      - run: python scripts/runtime_lock.py check-installed
      - name: Create the test role and its database
        run: |
          python -I - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://postgres:ci-admin-pw@127.0.0.1:5432/postgres", autocommit=True) as admin:
              admin.execute("CREATE ROLE studio_owner LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD 'ci-owner-pw'")
              admin.execute("CREATE DATABASE studio_test OWNER studio_owner")
              print(admin.execute("SELECT version()").fetchone()[0])
          PY
      # STU-022 (TD-035): the DDL test compares with the runner's own pg_dump; it must be there and not older than
      # the server (pg_dump refuses a newer server), so its version is logged and the live comparison is required.
      - run: pg_dump --version
      - run: pytest -m "postgres or postgres_superuser" -v -p no:cacheprovider -rs --junitxml="$RUNNER_TEMP/postgres.xml"
        env:
          # The throwaway server's own superuser, for the tests that make roles (marker postgres_superuser, CI-1).
          TABRION_STUDIO_TEST_POSTGRES_SUPERUSER: postgresql://postgres:ci-admin-pw@127.0.0.1:5432/studio_test
          # A missing or refusing pg_dump fails the DDL test instead of skipping its live comparison (L-2, #38).
          TABRION_STUDIO_TEST_LIVE_PG_DUMP: "1"
      - name: Every PostgreSQL test ran and none was skipped
        env:
          JUNIT: ${{ runner.temp }}/postgres.xml
        run: |
          python -I - <<'PY'
          import os, xml.etree.ElementTree as ET
          root = ET.parse(os.environ["JUNIT"]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          tests = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          bad = sum(int(s.get("failures", 0)) + int(s.get("errors", 0)) for s in suites)
          print(f"{tests} tests, {skipped} skipped, {bad} failed")
          assert tests >= 50 and skipped == 0 and bad == 0, (tests, skipped, bad)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"### PostgreSQL 17\n\n{tests} tests passed, none skipped\n")
          PY

  frontend-lint:
    name: frontend lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  frontend-unit:
    name: frontend unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test

  e2e:
    name: e2e
    # Review U-3: the Playwright suites in Chromium on every pull request. The harness suites (a11y with axe, WCAG
    # 2.0-2.2 A/AA with color contrast, light/dark x en/de, and the others) run against the e2e harness; the
    # *-backend.spec.ts suites run the built wheel in a real tabrion-studio process under the CSP of STU-003, and
    # explorer-reference.spec.ts runs it against tabrion's reference apps (STU-010; their SQLite part, the PostgreSQL
    # part needs URLs this job does not set). That part is an `if` inside the test, not a skip, so the gate below does
    # not see that it did not run (TD-041). The screenshot suite is skipped (STUDIO_SCREENSHOTS unset).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm ci + npm run build; the result goes to src/tabrion_studio/static and into the wheel.
      - run: python scripts/build_frontend.py
      - run: pip install "build==1.6.1"
      - run: python -m build --wheel --outdir dist
        env:
          # TD-031: the build backend from the hashed pins (the wheel's bytes depend on it, TABRION QA-8).
          PIP_CONSTRAINT: ${{ github.workspace }}/build-constraints.txt
          PIP_REQUIRE_HASHES: "1"
      - name: Install the wheel into a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/studio"
          "$RUNNER_TEMP/studio/bin/python" -m pip install --quiet --require-hashes --no-deps --only-binary ":all:" -r constraints/runtime-lock.txt
          "$RUNNER_TEMP/studio/bin/python" -m pip install --quiet --no-deps dist/tabrion_studio-*.whl -r constraints/tabrion-integration.txt
          "$RUNNER_TEMP/studio/bin/python" -m pip check
      # explorer-reference.spec.ts (TD-041) creates tabrion's reference apps with their own code: the examples of the
      # very tabrion commit the constraints pin, so they match the tabrion installed above.
      - name: The tabrion commit the constraints pin
        id: tabrion
        run: |
          sha=$(sed -n 's|^tabrion @ git+https://github.com/peterkarlhuber/tabrion@\([0-9a-f]\{40\}\)$|\1|p' constraints/tabrion-integration.txt)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "no full-SHA tabrion pin in constraints/tabrion-integration.txt"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: peterkarlhuber/tabrion
          ref: ${{ steps.tabrion.outputs.sha }}
          path: tabrion
          sparse-checkout: examples
          persist-credentials: false
      # The Chromium build that the locked @playwright/test expects (U-5), with its system libraries.
      - run: npm run e2e:install
        working-directory: frontend
      - run: npm run e2e -- --reporter=list,json
        working-directory: frontend
        env:
          TABRION_STUDIO_E2E_PYTHON: ${{ runner.temp }}/studio/bin/python
          TABRION_STUDIO_E2E_EXAMPLES: ${{ github.workspace }}/tabrion/examples
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/e2e.json
      - name: Every suite ran and none was skipped
        env:
          E2E_REPORT: ${{ runner.temp }}/e2e.json
        run: |
          python -I - <<'PY'
          import collections, json, os, re
          report = json.load(open(os.environ["E2E_REPORT"]))
          counts = collections.Counter()
          def walk(suite, file):
              file = suite.get("file", file)
              for spec in suite.get("specs", []):
                  for test in spec["tests"]:
                      counts[(file, test["status"])] += 1
              for child in suite.get("suites", []):
                  walk(child, file)
          for suite in report["suites"]:
              walk(suite, None)
          print(dict(counts))
          # Every test file Playwright runs (its default testMatch under testDir frontend/e2e, subfolders included, named
          # as in the report) must pass with none of its tests skipped, so a new one is required as soon as it is
          # added; only these may skip, each for its reason.
          optional = {"screenshots.spec.ts": "takes screenshots only when STUDIO_SCREENSHOTS names a folder"}
          root = "frontend/e2e"
          specs = {
              os.path.relpath(os.path.join(folder, name), root).replace(os.sep, "/")
              for folder, _, names in os.walk(root)
              for name in names
              if re.search(r"\.(spec|test)\.[cm]?[jt]sx?$", name)
          }
          required = sorted(specs - set(optional))
          assert len(required) >= 19 and set(optional) <= specs, (required, optional)
          for file in required:
              assert counts[(file, "expected")] > 0, f"{file}: no test passed"
              bad = {s: n for (f, s), n in counts.items() if f == file and s != "expected"}
              assert not bad, f"{file}: {bad}"
          assert report["stats"]["unexpected"] == 0, report["stats"]
          rows = [f"| {f} | {counts[(f, 'expected')]} |" for f in required]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("### e2e (Chromium)\n\n| Suite | Passed |\n|---|---|\n" + "\n".join(rows) + "\n")
          PY
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results
          path: frontend/test-results/
          if-no-files-found: ignore

  e2e-browsers:
    name: e2e (${{ matrix.browser }})
    # STU-050 (08 section 11, TD-047): the same suites in Firefox and WebKit, against the same built wheel. The browser
    # is the one the locked @playwright/test installs. Required like "e2e" since both have been green (PR #63; they
    # were advisory before). The gate below is the e2e job's,
    # except that a test may skip with a "chromium only:" reason (the heap measurements through CDP).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python scripts/build_frontend.py
      - run: pip install "build==1.6.1"
      - run: python -m build --wheel --outdir dist
        env:
          # TD-031: the build backend from the hashed pins (the wheel's bytes depend on it, TABRION QA-8).
          PIP_CONSTRAINT: ${{ github.workspace }}/build-constraints.txt
          PIP_REQUIRE_HASHES: "1"
      - name: Install the wheel into a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/studio"
          "$RUNNER_TEMP/studio/bin/python" -m pip install --quiet --require-hashes --no-deps --only-binary ":all:" -r constraints/runtime-lock.txt
          "$RUNNER_TEMP/studio/bin/python" -m pip install --quiet --no-deps dist/tabrion_studio-*.whl -r constraints/tabrion-integration.txt
          "$RUNNER_TEMP/studio/bin/python" -m pip check
      - name: The tabrion commit the constraints pin
        id: tabrion
        run: |
          sha=$(sed -n 's|^tabrion @ git+https://github.com/peterkarlhuber/tabrion@\([0-9a-f]\{40\}\)$|\1|p' constraints/tabrion-integration.txt)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "no full-SHA tabrion pin in constraints/tabrion-integration.txt"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: peterkarlhuber/tabrion
          ref: ${{ steps.tabrion.outputs.sha }}
          path: tabrion
          sparse-checkout: examples
          persist-credentials: false
      # The browser build of the locked @playwright/test (node_modules from `npm ci` above), with its system libraries.
      - run: npx playwright install --with-deps "${{ matrix.browser }}"
        working-directory: frontend
      - run: npm run e2e -- --reporter=list,json
        working-directory: frontend
        env:
          STUDIO_E2E_BROWSERS: ${{ matrix.browser }}
          TABRION_STUDIO_E2E_PYTHON: ${{ runner.temp }}/studio/bin/python
          TABRION_STUDIO_E2E_EXAMPLES: ${{ github.workspace }}/tabrion/examples
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/e2e.json
      - name: Every suite ran and none was skipped (except "chromium only")
        env:
          E2E_REPORT: ${{ runner.temp }}/e2e.json
          BROWSER: ${{ matrix.browser }}
        run: |
          python -I - <<'PY'
          import collections, json, os, re
          report = json.load(open(os.environ["E2E_REPORT"]))
          counts = collections.Counter()
          def walk(suite, file):
              file = suite.get("file", file)
              for spec in suite.get("specs", []):
                  for test in spec["tests"]:
                      status = test["status"]
                      annotations = test.get("annotations", [])
                      reasons = [a.get("description", "") for a in annotations if a.get("type") == "skip"]
                      # Only a plain skip with a "chromium only:" reason; a fixme or fail annotation never counts.
                      flagged = any(a.get("type") in ("fixme", "fail") for a in annotations)
                      if (
                          status == "skipped"
                          and reasons
                          and not flagged
                          and all(r.startswith("chromium only:") for r in reasons)
                      ):
                          status = "chromium only"
                      counts[(file, status)] += 1
              for child in suite.get("suites", []):
                  walk(child, file)
          for suite in report["suites"]:
              walk(suite, None)
          print(dict(counts))
          optional = {"screenshots.spec.ts": "takes screenshots only when STUDIO_SCREENSHOTS names a folder"}
          root = "frontend/e2e"
          specs = {
              os.path.relpath(os.path.join(folder, name), root).replace(os.sep, "/")
              for folder, _, names in os.walk(root)
              for name in names
              if re.search(r"\.(spec|test)\.[cm]?[jt]sx?$", name)
          }
          required = sorted(specs - set(optional))
          assert len(required) >= 19 and set(optional) <= specs, (required, optional)
          for file in required:
              assert counts[(file, "expected")] > 0, f"{file}: no test passed"
              bad = {s: n for (f, s), n in counts.items() if f == file and s not in ("expected", "chromium only")}
              assert not bad, f"{file}: {bad}"
          assert report["stats"]["unexpected"] == 0, report["stats"]
          rows = [f"| {f} | {counts[(f, 'expected')]} | {counts[(f, 'chromium only')]} |" for f in required]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"### e2e ({os.environ['BROWSER']})\n\n| Suite | Passed | Chromium only |\n|---|---|---|\n" + "\n".join(rows) + "\n")
          PY
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results-${{ matrix.browser }}
          path: frontend/test-results/
          if-no-files-found: ignore

  packaging:
    name: build and install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # STU-001: npm ci + npm run build on every OS; the result goes to src/tabrion_studio/static.
      - run: python scripts/build_frontend.py
      - run: pip install "build==1.6.1" "pytest==9.2.0" "twine==7.0.0"
      # STU-018: the hatch hook refuses a wheel without static/index.html.
      - run: python -m build --outdir dist
        env:
          # TD-031: the build backend from the hashed pins (the wheel's bytes depend on it, TABRION QA-8).
          PIP_CONSTRAINT: ${{ github.workspace }}/build-constraints.txt
          PIP_REQUIRE_HASHES: "1"
      - run: twine check --strict dist/*
      - run: pytest -m packaging tests/packaging -v -p no:cacheprovider
        env:
          TABRION_STUDIO_DIST: dist
      # Fresh venv from the wheel, then run with every Node folder removed from PATH. The script installs the hashed
      # runtime lock, then the wheel and the tabrion pin with --no-deps (tabrion is not on PyPI, ADR 0009 amendment).
      - run: python scripts/smoke_wheel.py dist/tabrion_studio-*.whl
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  supply-chain:
    name: license and supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python scripts/build_frontend.py
      - run: pip install "build==1.6.1"
      - run: python -m build --wheel --outdir dist
        env:
          # TD-031: the build backend from the hashed pins (the wheel's bytes depend on it, TABRION QA-8).
          PIP_CONSTRAINT: ${{ github.workspace }}/build-constraints.txt
          PIP_REQUIRE_HASHES: "1"
      # STU-031: what users install = the wheel and its runtime dependencies, in a fresh environment.
      - name: Install the wheel into a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/runtime"
          "$RUNNER_TEMP/runtime/bin/python" -m pip install --quiet --require-hashes --no-deps --only-binary ":all:" -r constraints/runtime-lock.txt
          "$RUNNER_TEMP/runtime/bin/python" -m pip install --quiet --no-deps dist/tabrion_studio-*.whl -r constraints/tabrion-integration.txt
          "$RUNNER_TEMP/runtime/bin/python" -m pip check
      - run: mkdir -p sbom && "$RUNNER_TEMP/runtime/bin/python" -I scripts/collect_licenses.py > sbom/licenses-python.json
      - name: License policy (Python runtime closure and npm lockfile)
        run: python -I scripts/check_licenses.py --python sbom/licenses-python.json --npm frontend/package-lock.json
      - name: Negative probes (a disallowed license must fail the check)
        run: |
          set -u
          for probe in "--python tests/supply_chain/probes/python-gpl.json" "--npm tests/supply_chain/probes/npm-gpl-lock.json"; do
            if python -I scripts/check_licenses.py $probe; then
              echo "::error::the license check accepted the GPL probe ($probe)"
              exit 1
            fi
          done
          echo "both probes were rejected as expected"
      - name: SBOMs (CycloneDX)
        run: |
          python -m venv "$RUNNER_TEMP/sbom-tools"
          "$RUNNER_TEMP/sbom-tools/bin/python" -m pip install --quiet "cyclonedx-bom==8.0.1"
          "$RUNNER_TEMP/sbom-tools/bin/cyclonedx-py" environment --pyproject pyproject.toml --of JSON \
            --output-reproducible -o sbom/tabrion-studio-python.cdx.json "$RUNNER_TEMP/runtime/bin/python"
          (cd frontend && npm sbom --sbom-format cyclonedx --package-lock-only) > sbom/tabrion-studio-frontend.cdx.json
      - name: The SBOMs list the expected components
        run: |
          python -I - <<'PY'
          import json
          py = json.load(open("sbom/tabrion-studio-python.cdx.json"))
          names = {c["name"].lower() for c in py["components"]}
          missing = {"fastapi", "uvicorn", "psycopg", "keyring"} - names
          assert py["bomFormat"] == "CycloneDX" and not missing, f"python SBOM lacks {missing}"
          assert py["metadata"]["component"]["name"] == "tabrion-studio", py["metadata"]["component"]
          npm = json.load(open("sbom/tabrion-studio-frontend.cdx.json"))
          shipped = sorted(c["name"] for c in npm["components"] if c.get("scope") == "required")
          assert {"react", "react-dom"} <= set(shipped), shipped
          print(f"python SBOM: {len(names)} components; frontend SBOM: {len(npm['components'])} ({shipped} shipped)")
          PY
          { echo "### SBOM"; echo; ls -l sbom | sed 's/^/    /'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --upgrade pip
      # The runtime dependencies as locked (TD-031) and the development toolchain.
      # DC-TS-1: pip 24.0 to 26.0 crash on a "-c" Git pin with extras; 26.1 and newer never ask an index for tabrion.
      - run: python -m pip install "pip>=26.1"
      - run: pip install --require-hashes --no-deps --only-binary ":all:" -r constraints/runtime-lock.txt
      - run: pip install "pip-audit==2.10.1" -e ".[dev]" -c constraints/tabrion-integration.txt
      - run: pip check
      - run: python scripts/runtime_lock.py check-installed
      - run: pip-audit --skip-editable --progress-spinner off
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  # DC-TS-1 (dependency confusion; owner decision of 2026-11-13 22:37Z: tabrion is not registered on PyPI). Both install
  # paths run with every installer's index replaced by a poisoned one (scripts/check_tabrion_source.py, the unchanged
  # copy of nodestro-studio's script, SHA-256 pinned by tests/supply_chain/test_check_tabrion_source.py). It serves
  # a poisoned tabrion (a wheel with a forged direct_url.json and an sdist, both run code) and redirects every other name
  # to PyPI. Red when pip asks that index for tabrion at all (the proof; direct_url.json checks only detect an
  # accidental index install), when an install never used the index or an index option would bypass it, when poisoned
  # code ran, or when tabrion's direct_url.json is not the pin's; a positive control first shows that a plain
  # "pip install tabrion" would take the poisoned release. No pip cache, so every request reaches the index.
  install-poisoned-index:
    name: install (poisoned index)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: The CI development install (-e ".[dev]" -c the pin), then check-installed
        run: |
          python -m venv "$RUNNER_TEMP/dev"
          python -I scripts/check_tabrion_source.py --lock constraints/tabrion-integration.txt \
            --python "$RUNNER_TEMP/dev/bin/python" -- bash -euo pipefail -c '
            py="$RUNNER_TEMP/dev/bin/python"
            "$py" -m pip install --no-cache-dir "pip>=26.1"
            "$py" -m pip install --no-cache-dir --require-hashes --no-deps --only-binary ":all:" -r constraints/runtime-lock.txt
            "$py" -m pip install --no-cache-dir -e ".[dev]" -c constraints/tabrion-integration.txt
            "$py" -m pip check
            "$py" scripts/runtime_lock.py check-installed'
      # README and docs/guide/installation.md install "--no-deps . -r the pin"; "." needs the built frontend (Node),
      # so this runs the same command on an editable install, which skips that check and resolves tabrion the same way.
      - name: The documented runtime install (--no-deps -r the pin)
        run: |
          python -m venv "$RUNNER_TEMP/runtime"
          python -I scripts/check_tabrion_source.py --lock constraints/tabrion-integration.txt \
            --python "$RUNNER_TEMP/runtime/bin/python" -- bash -euo pipefail -c '
            py="$RUNNER_TEMP/runtime/bin/python"
            "$py" -m pip install --no-cache-dir "pip>=26.1"
            "$py" -m pip install --no-cache-dir --require-hashes --no-deps --only-binary ":all:" -r constraints/runtime-lock.txt
            "$py" -m pip install --no-cache-dir --no-deps -e . -r constraints/tabrion-integration.txt
            "$py" -m pip check'

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      # DC-TS-1: pip 24.0 to 26.0 crash on a "-c" Git pin with extras; 26.1 and newer never ask an index for tabrion.
      - run: python -m pip install "pip>=26.1"
      - run: pip install --require-hashes --no-deps --only-binary ":all:" -r constraints/runtime-lock.txt
      - run: pip install -e ".[dev]" -c constraints/tabrion-integration.txt
      - run: pip check
      - run: python scripts/runtime_lock.py check-installed
      - run: mkdocs build --strict
