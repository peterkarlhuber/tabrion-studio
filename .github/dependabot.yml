# Conservative update policy (05 sections 1 and 2.8): grouped weekly pull requests for Python dependencies, the
# frontend's npm dependencies and GitHub Actions (the workflows pin every action by commit SHA; Dependabot keeps
# those pins current). cooldown: a new release is proposed only after a few days (a week for majors), so a broken
# or compromised release is usually withdrawn before it reaches a pull request; security updates are not delayed.
# No auto-merge. tabrion itself is pinned by git SHA until v0.1.0 (docs/TODO.md) and is bumped by hand.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: tabrion

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
