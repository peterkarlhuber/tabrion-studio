site_name: Tabrion Studio
site_description: Local developer tool for SQLite and PostgreSQL databases, built on Tabrion.
repo_url: https://github.com/peterkarlhuber/tabrion-studio
repo_name: peterkarlhuber/tabrion-studio
copyright: "Copyright &copy; 2026 Levuvo. All rights reserved. Names and logos: see TRADEMARKS.md"
strict: true

theme:
  name: material
  logo: assets/branding/tabrion-studio-mark-on-dark-128.png  # the header bar is dark slate in both schemes
  favicon: assets/branding/favicon-32.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

extra_css:
  - assets/stylesheets/tabrion-studio.css

plugins:
  - search

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - User guide:
      - guide/index.md
      - Installation: guide/installation.md
      - Starting and stopping: guide/starting.md
      - Connections: guide/connections.md
      - Diagnostics: guide/diagnostics.md
      - Vector data: guide/vector-data.md
      - Migration status: guide/migrations.md
      - Explorer: guide/explorer.md
      - SQL editor: guide/sql-editor.md
      - Query history and favorites: guide/history.md
      - Data viewer: guide/data-viewer.md
      - Settings and keyboard: guide/settings.md
      - How Studio protects your data: guide/security.md
      - Troubleshooting: guide/troubleshooting.md
  - Architecture:
      - Process model: architecture/process-model.md
      - Access protection: architecture/access-protection.md
      - Errors and logging: architecture/errors-and-logging.md
      - Configuration and project trust: architecture/configuration.md
      - Secret management: architecture/secrets.md
      - Connections and read-only enforcement: architecture/connections.md
      - Query engine: architecture/queries.md
      - Database explorer: architecture/explorer.md
      - Data viewer: architecture/viewer.md
      - Diagnostics: architecture/diagnostics.md
      - Vector data inspection: architecture/vector-inspection.md
      - Migration status: architecture/migrations.md
      - Export: architecture/exports.md
      - History, favorites and scripts: architecture/history-and-scripts.md
      - App shell and design system: architecture/frontend.md
      - Accessibility audit: architecture/accessibility.md
      - UX acceptance: architecture/ux-acceptance.md
      - Security review preparation: architecture/security-review-prep.md
  - Development:
      - Building and testing: development/building.md
      - CI and supply chain: development/ci.md
      - Repository conventions: development/conventions.md
      - Documentation checklist: development/docs-checklist.md
      - Release checklist 1.0: development/release-checklist.md
      - QA-S1 checklist suite: development/qa-s1-suite.md
      - Tabrion API used: api-consumers.md
  - Architecture decisions:
      - adr/README.md
      - "0001 Local web app": adr/0001-local-web-app.md
      - "0002 Local security model": adr/0002-local-security-model.md
      - "0003 Writes behind a gate": adr/0003-writes-behind-gate.md
      - "0004 Frontend reuse": adr/0004-frontend-reuse.md
      - "0005 CR-DBX write and admin gates": adr/0005-crdbx-write-and-admin-gates.md
  - Open work: TODO.md
